{% if rows %}
    <div class="grid grid-cols-3 gap-2">
        {% for row in rows %}
            <div class="relative group">
                <img src="{{ row.image.url }}" alt="{{ row.caption }}"
                     class="w-full h-24 object-cover rounded border border-bg-soft dark:border-white/10">
                <div class="absolute inset-0 opacity-0 group-hover:opacity-100 bg-black/50 rounded flex items-center justify-center gap-2 transition">
                    {% include "employees/sections/_row_actions.html" %}
                </div>
                {% if row.caption %}<div class="text-xs text-text-mute truncate mt-1">{{ row.caption }}</div>{% endif %}
            </div>
        {% endfor %}
    </div>
{% else %}
    {% include "employees/sections/_empty.html" %}
{% endif %}
